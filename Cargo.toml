[package]
name = "zk_whitelist"
version = "1.9.11"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ark-bn254 = "0.5.0"
ark-circom = "0.5.0"
ark-groth16 = "0.5.0"
ark-serialize = "0.5.0"
ark-snark = "0.5.1"
clap = { version = "4.4.7", features = ["derive"] }
fake = { version = "2.9", features = ["derive"] }
hex = "0.4.3"
num-bigint = "0.4.4"
rand = "0.8.5"
serde_json = "1.0.108"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
assert_cmd = "2.0.12"
predicates = "3.0.4"

[[bin]]
name = "zk_whitelist"
path = "src/main.rs"
